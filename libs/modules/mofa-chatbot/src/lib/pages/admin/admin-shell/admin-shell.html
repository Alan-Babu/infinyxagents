<nav class="flex w-64 shrink-0 flex-col gap-1 overflow-y-auto border-e border-gray-200 bg-white p-4" role="tablist">
    @for (tab of tabs; track tab.path) {
        <a
            [routerLink]="tab.path"
            routerLinkActive="bg-primary-50 text-primary-800 font-bold"
            [routerLinkActiveOptions]="{ exact: tab.exact }"
            role="tab"
            class="flex cursor-pointer items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50"
        >
            <i [class]="tab.icon"></i>
            {{ tab.labelKey | translate }}
        </a>
    }
</nav>

<div class="min-h-0 flex-1 overflow-y-auto">
    <router-outlet />
</div>

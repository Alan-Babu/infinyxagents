<div class="flex flex-col gap-5 p-6">
    <h1 class="text-xl font-bold text-gray-800">{{ 'mofaChatbot.admin.sessions.title' | translate }}</h1>

    <div class="flex flex-wrap items-center gap-3">
        <p-select [(ngModel)]="language" [options]="languageOptions" optionLabel="label" optionValue="value" styleClass="w-48" (onChange)="load()" />
        <p-select [(ngModel)]="sentiment" [options]="sentimentOptions" optionLabel="label" optionValue="value" styleClass="w-48" (onChange)="load()" />
    </div>

    @if (loading) {
        <div class="flex items-center justify-center py-16">
            <i class="pi pi-spin pi-spinner text-2xl text-primary-500"></i>
        </div>
    } @else {
        <lib-data-table [rowData]="sessions" [colDefs]="colDefs" [showSearch]="false" [paginator]="true" [noRowsMessage]="'mofaChatbot.admin.sessions.noSessions' | translate" />
    }
</div>

<lib-risk-session-transcript-drawer [transcript]="transcript" titleKey="mofaChatbot.admin.sessions.transcriptTitle" (closed)="closeTranscript()" />

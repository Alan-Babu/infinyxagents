<p-drawer [(visible)]="visible" position="right" styleClass="p-drawer-sm" appendTo="body" [baseZIndex]="1200" (onHide)="visibleChange.emit(false)">
    <ng-template #header>
        <div class="flex flex-col">
            <span class="text-xs font-bold uppercase tracking-wide text-primary-600">{{ eyebrowKey | translate }}</span>
            <span class="text-lg font-bold text-gray-800">{{ titleKey | translate }}</span>
        </div>
    </ng-template>

    <div class="flex flex-col gap-1.5">
        <label class="p-control-label p-control-label-required" for="nameEntryValue">{{ labelKey | translate }}</label>
        <input id="nameEntryValue" type="text" pInputText class="w-full" [(ngModel)]="name" [placeholder]="placeholderKey | translate" (keydown.enter)="confirm()" />
    </div>

    <ng-template #footer>
        <div class="flex justify-end gap-2">
            <button type="button" pButton severity="secondary" [outlined]="true" (click)="close()"><span>{{ "assetIntelligence.settings.org.cancel" | translate }}</span></button>
            <button type="button" pButton [disabled]="!name.trim()" (click)="confirm()"><span>{{ "assetIntelligence.settings.org.add" | translate }}</span></button>
        </div>
    </ng-template>
</p-drawer>

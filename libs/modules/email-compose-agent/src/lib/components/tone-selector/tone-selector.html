<div class="flex flex-col gap-1.5">
    @if (label) {
    <span class="p-control-label">{{ label }}</span>
    }
    <div class="flex flex-wrap gap-2">
        @for (tone of tones; track tone) {
        <button type="button" class="cursor-pointer rounded-md border px-3.5 py-1.5 text-xs font-semibold transition-colors"
            [class.bg-primary-500]="value === tone" [class.text-white]="value === tone" [class.border-primary-500]="value === tone"
            [class.border-gray-200]="value !== tone" [class.text-gray-500]="value !== tone"
            (click)="select(tone)">
            {{ 'emailComposeAgent.tones.' + tone | translate }}
        </button>
        }
    </div>
</div>

<div class="flex h-full min-h-0 flex-col">
    <lib-page-header titleKey="translatorAgent.myDocuments.title" subtitleKey="translatorAgent.myDocuments.subtitle" [showBack]="false">
        <lib-translator-toolbar />
    </lib-page-header>

    <div class="min-h-0 flex-1 overflow-y-auto px-6 py-6">
        <div class="flex flex-col gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
                <span class="relative min-w-56 flex-1">
                    <i class="pi pi-search absolute start-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
                    <input pInputText type="text" class="w-full ps-8" [placeholder]="'translatorAgent.myDocuments.searchPlaceholder' | translate"
                        [(ngModel)]="search" (keydown.enter)="applyFilters()" />
                </span>
                <p-select [options]="statusOptions" [(ngModel)]="status" optionLabel="label" optionValue="value" styleClass="min-w-40" appendTo="body" (ngModelChange)="applyFilters()" />
                <p-select [options]="riskOptions" [(ngModel)]="riskLevel" optionLabel="label" optionValue="value" styleClass="min-w-36" appendTo="body" (ngModelChange)="applyFilters()" />
                <p-select [options]="categoryOptions" [(ngModel)]="category" optionLabel="label" optionValue="value" styleClass="min-w-40" appendTo="body" (ngModelChange)="applyFilters()" />
                <p-select [options]="classificationOptions" [(ngModel)]="classification" optionLabel="label" optionValue="value" styleClass="min-w-44" appendTo="body" (ngModelChange)="applyFilters()" />
                <button type="button" pButton size="small" (click)="applyFilters()"><span>{{ 'translatorAgent.myDocuments.search' | translate }}</span></button>
            </div>

            <div class="hidden flex-wrap items-center gap-3 text-xs text-gray-600">
                <label class="flex items-center gap-1.5">{{ "translatorAgent.filters.from" | translate }}
                    <input type="date" class="rounded-lg border border-gray-300 px-2 py-1" [(ngModel)]="dateFrom" (change)="applyFilters()" />
                </label>
                <label class="flex items-center gap-1.5">{{ "translatorAgent.filters.to" | translate }}
                    <input type="date" class="rounded-lg border border-gray-300 px-2 py-1" [(ngModel)]="dateTo" (change)="applyFilters()" />
                </label>
                @if (pagination) {
                <span class="text-gray-400">{{ "translatorAgent.myDocuments.resultCount" | translate: { count: pagination.total_count } }}</span>
                }
            </div>

            <lib-data-table [rowData]="documents" [colDefs]="colDefs" [paginator]="false" [showSearch]="false" (rowClick)="openDocument($event)" />

            @if (pagination && pagination.total_pages > 1) {
            <div class="flex items-center justify-between">
                <button type="button" pButton size="small" severity="secondary" [outlined]="true" [disabled]="!pagination.has_prev" (click)="goToPage(-1)"><span>{{ 'translatorAgent.pagination.prev' | translate }}</span></button>
                <span class="text-xs text-gray-500">{{ "translatorAgent.pagination.pageOf" | translate: { page: pagination.page, total: pagination.total_pages } }}</span>
                <button type="button" pButton size="small" severity="secondary" [outlined]="true" [disabled]="!pagination.has_next" (click)="goToPage(1)"><span>{{ 'translatorAgent.pagination.next' | translate }}</span></button>
            </div>
            }
        </div>
    </div>
</div>

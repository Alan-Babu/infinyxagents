<div class="flex flex-col gap-2.5">
    @for (d of data; track d.label) {
    <div class="grid grid-cols-[90px_1fr_70px] items-center gap-2.5">
        <span class="truncate text-end text-xs text-gray-500">{{ d.label }}</span>
        <div class="h-3.5 overflow-hidden rounded-full bg-gray-100">
            <div class="h-full rounded-full bg-primary-500 transition-[width]" [style.width.%]="pct(d.value)"></div>
        </div>
        <span class="text-xs font-bold text-gray-800">{{ formatValue(d.value) }}</span>
    </div>
    }
</div>

<lib-page-header titleKey="executiveSummary.myTasks.title" subtitleKey="executiveSummary.myTasks.subtitle" [showBack]="false" />

<div class="space-y-5 p-6">
    <nav class="inline-flex rounded-lg border border-gray-200 bg-white p-1" role="tablist">
        @for (tab of tabs; track tab.id) {
        <button type="button"
            class="cursor-pointer transition-colors whitespace-nowrap px-6 text-sm py-2.5 rounded-md text-center"
            [ngClass]="subTab === tab.id ? 'bg-primary-500 text-white font-bold' : 'text-gray-500 font-semibold'"
            (click)="switchTab(tab.id)">{{ tab.labelKey | translate }}
            <span class="ms-1.5 rounded-full px-2 py-0.5 text-xs"
                [ngClass]="subTab === tab.id ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'">{{ tabCount(tab.id) }}</span>
        </button>
        }
    </nav>

    <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-4">
        <lib-stat-card [label]="'executiveSummary.myTasks.total' | translate" [value]="currentTabTasks.length" icon="pi pi-list-check" fgClass="text-primary-600" bgClass="bg-primary-50" />
        <lib-stat-card [label]="'executiveSummary.myTasks.overdue' | translate" [value]="overdueCount"
            icon="pi pi-exclamation-triangle" [fgClass]="overdueCount > 0 ? 'text-red-600' : 'text-gray-800'" [bgClass]="overdueCount > 0 ? 'bg-red-50' : 'bg-gray-100'" />
        <lib-stat-card [label]="'executiveSummary.myTasks.done' | translate" [value]="doneCount" icon="pi pi-check-circle" fgClass="text-green-600" bgClass="bg-green-50" />
    </div>

    <lib-data-table [rowData]="currentTabTasks" [colDefs]="colDefs" [gridOptions]="gridOptions" [paginator]="true" [searchPlaceholder]="'executiveSummary.search' | translate">
        <span class="font-semibold text-gray-700">{{ currentTabTasks.length }} {{ "executiveSummary.records" | translate }}</span>
    </lib-data-table>
</div>

<div class="flex h-full min-h-0 flex-col">
    <lib-page-header [titleKey]="'digitalAttestation.' + statusGroup + '.title'" [subtitleKey]="'digitalAttestation.' + statusGroup + '.subtitle'" [showBack]="false" />

    <div class="min-h-0 flex-1 overflow-y-auto px-6 py-6">
        <div class="flex flex-col gap-4">
            @if (errorMessage) {
            <p class="text-sm text-red-600">{{ errorMessage }}</p>
            }
            <div class="flex flex-wrap items-center gap-2.5">
                <span class="relative min-w-56 flex-1">
                    <i class="pi pi-search absolute start-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
                    <input pInputText type="text" class="w-full ps-8" [placeholder]="'digitalAttestation.filters.searchPlaceholder' | translate" [(ngModel)]="search" (ngModelChange)="applyFilters()" />
                </span>
                <p-select [options]="docTypeOptions" [(ngModel)]="docType" optionLabel="label" optionValue="value" styleClass="min-w-52" appendTo="body" (ngModelChange)="applyFilters()" />
                <p-select [options]="countryOptions" [(ngModel)]="country" optionLabel="label" optionValue="value" styleClass="min-w-44" appendTo="body" (ngModelChange)="applyFilters()" />
            </div>

            <div class="text-xs text-gray-400">{{ "digitalAttestation.filters.countOf" | translate: { shown: filteredCases.length, total: baseCases.length } }}</div>

            <lib-data-table [rowData]="filteredCases" [colDefs]="colDefs" [paginator]="true" [showSearch]="false" (rowClick)="openCase($event)" />
        </div>
    </div>

    <lib-case-drawer [row]="drawerCase" (closed)="closeDrawer()" (decided)="onDecided()" />
</div>

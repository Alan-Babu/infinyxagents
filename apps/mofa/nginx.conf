server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routing -- any path nginx doesn't otherwise match falls
    # through to index.html so the Angular router (not nginx) decides what
    # to render, including /mofa-chatbot/shared/:token (the unauthenticated
    # shared-transcript route).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxies this app's own module segment to the backend, matching
    # ApiService.resolveBaseUrl('mofa-chatbot/api') in
    # libs/common/services/src/lib/api.ts -- a request to
    # /mofa-chatbot/api/chat/messages/stream is forwarded to
    # ${BACKEND_ORIGIN}/api/chat/messages/stream.
    #
    # Every setting below exists for ONE reason: /chat/messages/stream must
    # reach the browser as it's generated, not as one buffered chunk at the
    # end. Any of proxy_buffering, gzip, or a missing X-Accel-Buffering
    # header being wrong here silently turns streaming back into the exact
    # "wait for everything, then render" latency this was built to avoid.
    location /mofa-chatbot/api/ {
        proxy_pass ${BACKEND_ORIGIN}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 120s;
    }

    # Long-cache the hashed, content-addressed JS/CSS/font/image bundle --
    # filenames change on every production build (outputHashing: "all" in
    # apps/mofa/project.json), so caching them indefinitely is always safe
    # and cuts repeat-visit load latency.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
